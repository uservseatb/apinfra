<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="580" viewBox="0 0 1040 580" role="img" aria-label="apinfra architecture: storefront, dashboard, worker, config repository, and single host">
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
        </marker>
        <style>
            .title { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; }
            .box { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 700; }
            .sub { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 500; }
            .label { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #8b949e; }
        </style>
    </defs>

    <!-- Config repository -->
    <rect x="28" y="28" width="400" height="160" rx="16" fill="#fffaf3" stroke="#fde68a" stroke-width="1.5"/>
    <text x="228" y="58" text-anchor="middle" class="title" fill="#b45309">Config repository</text>

    <rect x="48" y="80" width="170" height="84" rx="12" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
    <text x="133" y="116" text-anchor="middle" class="box" fill="#92400e">settings.yml</text>
    <text x="133" y="138" text-anchor="middle" class="sub" fill="#b45309">project routing</text>

    <rect x="238" y="80" width="170" height="84" rx="12" fill="#ffedd5" stroke="#fdba74" stroke-width="1.5"/>
    <text x="323" y="112" text-anchor="middle" class="box" fill="#9a3412">docker-compose.yml</text>
    <text x="323" y="134" text-anchor="middle" class="sub" fill="#c2410c">+ .env  (per-app)</text>

    <!-- Public clients = project names from settings.yml -->
    <rect x="48" y="320" width="160" height="78" rx="10" fill="#f3eefe" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="128" y="348" text-anchor="middle" class="box" fill="#6d28d9">storefront</text>
    <text x="128" y="370" text-anchor="middle" class="sub" fill="#8b5cf6">storefront.example.com</text>

    <rect x="248" y="320" width="160" height="78" rx="10" fill="#f3eefe" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="328" y="348" text-anchor="middle" class="box" fill="#6d28d9">dashboard</text>
    <text x="328" y="370" text-anchor="middle" class="sub" fill="#8b5cf6">http://&lt;ip&gt;:3333</text>

    <!-- Single host -->
    <rect x="500" y="28" width="512" height="524" rx="16" fill="#f3f8ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="756" y="58" text-anchor="middle" class="title" fill="#1d4ed8">Single host</text>

    <!-- Agent -->
    <rect x="540" y="92" width="420" height="48" rx="12" fill="#93c5fd" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="750" y="122" text-anchor="middle" class="title" fill="#ffffff">apinfra agent</text>

    <!-- Nginx -->
    <rect x="580" y="200" width="320" height="44" rx="10" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
    <text x="740" y="220" text-anchor="middle" class="box" fill="#15803d">Nginx</text>
    <text x="740" y="236" text-anchor="middle" class="sub" fill="#16a34a">reverse proxy</text>

    <!-- Containers: storefront / dashboard / worker -->
    <rect x="540" y="360" width="410" height="160" rx="14" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5" stroke-dasharray="6 4"/>

    <rect x="568" y="388" width="100" height="100" rx="12" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.5"/>
    <text x="618" y="418" text-anchor="middle" class="box" fill="#0369a1">web</text>
    <text x="618" y="440" text-anchor="middle" class="sub" fill="#0284c7">:80</text>
    <text x="618" y="462" text-anchor="middle" class="sub" fill="#6d28d9">storefront</text>

    <rect x="690" y="388" width="100" height="100" rx="12" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.5"/>
    <text x="740" y="418" text-anchor="middle" class="box" fill="#0369a1">app</text>
    <text x="740" y="440" text-anchor="middle" class="sub" fill="#0284c7">:3333</text>
    <text x="740" y="462" text-anchor="middle" class="sub" fill="#6d28d9">dashboard</text>

    <rect x="812" y="388" width="100" height="100" rx="12" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.5"/>
    <text x="862" y="418" text-anchor="middle" class="box" fill="#0369a1">worker</text>
    <text x="862" y="440" text-anchor="middle" class="sub" fill="#0284c7">no HTTP</text>
    <text x="862" y="462" text-anchor="middle" class="sub" fill="#6d28d9">worker</text>

    <text x="740" y="508" text-anchor="middle" class="sub" fill="#7dd3fc">Docker containers</text>

    <!-- Agent → Config -->
    <line x1="538" y1="116" x2="430" y2="116" stroke="#8b949e" stroke-width="1.75" marker-end="url(#arrow)"/>
    <text x="484" y="106" text-anchor="middle" class="label">clone / pull</text>

    <!-- storefront → Nginx (HTTPS / domain) -->
    <line x1="128" y1="320" x2="128" y2="250" stroke="#8b949e" stroke-width="1.75"/>
    <line x1="128" y1="250" x2="460" y2="250" stroke="#8b949e" stroke-width="1.75"/>
    <line x1="460" y1="250" x2="460" y2="214" stroke="#8b949e" stroke-width="1.75"/>
    <line x1="460" y1="214" x2="578" y2="214" stroke="#8b949e" stroke-width="1.75" marker-end="url(#arrow)"/>
    <text x="300" y="240" text-anchor="middle" class="label">HTTPS</text>

    <!-- dashboard → Nginx (HTTP port-only, separate path) -->
    <line x1="328" y1="320" x2="328" y2="280" stroke="#8b949e" stroke-width="1.75"/>
    <line x1="328" y1="280" x2="500" y2="280" stroke="#8b949e" stroke-width="1.75"/>
    <line x1="500" y1="280" x2="500" y2="230" stroke="#8b949e" stroke-width="1.75"/>
    <line x1="500" y1="230" x2="578" y2="230" stroke="#8b949e" stroke-width="1.75" marker-end="url(#arrow)"/>
    <text x="420" y="272" text-anchor="middle" class="label">HTTP :3333</text>

    <!-- Agent → Nginx -->
    <line x1="740" y1="140" x2="740" y2="198" stroke="#8b949e" stroke-width="1.75" marker-end="url(#arrow)"/>
    <text x="754" y="174" text-anchor="start" class="label">routes</text>

    <!-- Agent → containers -->
    <line x1="940" y1="140" x2="940" y2="360" stroke="#8b949e" stroke-width="1.75" marker-end="url(#arrow)"/>
    <text x="958" y="260" text-anchor="middle" class="label" transform="rotate(90 958 260)">compose up</text>

    <!-- Nginx → storefront (web) and dashboard (app) only; worker has no proxy -->
    <line x1="618" y1="244" x2="618" y2="386" stroke="#8b949e" stroke-width="1.75" marker-end="url(#arrow)"/>
    <line x1="740" y1="244" x2="740" y2="386" stroke="#8b949e" stroke-width="1.75" marker-end="url(#arrow)"/>
    <text x="634" y="320" text-anchor="start" class="label">proxy</text>
</svg>
